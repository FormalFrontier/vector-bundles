fidelity:
  divergences: >-
    Hermitian forms are conjugate-linear in the first argument. Metric and splitting
    constructions use RCLike scalars and retain original fiber topologies; the
    model norm need not arise from an inner product. Supplied-metric splitting
    needs an embedded intrinsic subbundle and finite-dimensional ambient model
    but no separation or paracompactness of the base. The isomorphism criterion
    works over incomplete nontrivially normed fields with finite-dimensional
    source model and target module topology, as well as under the complete-field
    specialization. Sigma-compactness results use general topological bundle APIs
    and the original topologies, not vector-space structure. Forward transfer uses
    an R₁ sigma-compact base and sigma-compact model, without nonemptiness or local
    compactness. Model reflection uses an R₀ base and a specified base point, without
    nonemptiness of the model. The factor characterization assumes an R₁ base and
    nonempty base and model; no separation of the model or total space is imposed.
    See the README and declarations for precise hypotheses.
review:
  status: agent-reviewed
acknowledgements: >-
  Hatcher's geometric constructions and the Mathlib contributors' formalizations
  underlie this library. In particular, the metric and semilinear APIs follow
  work by Sébastien Gouëzel, Heather Macbeth, Floris van Doorn, Sophie Morel and
  Yury Kudryashov. Additional contributor credits and authentic third-party
  notices remain in the individual modules.
