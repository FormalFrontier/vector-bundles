version: v0.4
project:
  name: Vector bundles
  authors:
    - Formal Frontier Agents
  license: Apache-2.0
  description: >-
    Compatible Hermitian and real fiber metrics on finite-dimensional vector bundles;
    orthogonal subbundles, addition homeomorphisms and continuous projections for a
    supplied metric; pairing-preserving local coordinates; and fiberwise linear
    isomorphisms, supported by linear-chart and finite-dimensional operator APIs.
    Products, pullbacks, cylinder charts, frames, finite model-power embeddings,
    range bundles and finite-dimensional complements over compact normal bases.
repository:
  role: substantive-development
sources:
  - title: Vector Bundles and K-Theory
    authors:
      - Allen Hatcher
    id: https://pi.math.cornell.edu/~hatcher/VBKT/VBpage.html
    type: book
    location: >-
      Version 2.2 (November 2017), section 1.1: Lemma 1.1, Proposition 1.2
      and its Hermitian remark, supplied-metric ingredients of Proposition 1.3,
      finite complements in Proposition 1.4, pullbacks in Proposition 1.5, and
      the two preliminary cylinder facts used in Proposition 1.7.
    relationship: adapts
    note: >-
      Uses the mathematical constructions, not copied book text. Metric existence
      is separated from supplied-metric splitting. The finite complement need not
      be complementary to a prescribed embedding. No classification theorem is asserted.
  - title: Mathlib
    authors:
      - The Mathlib Community
    id: https://github.com/leanprover-community/mathlib4/tree/83abb3e776bdefcbc447a1e44d0debe4010039e5
    type: software
    location: >-
      Topology.VectorBundle; module topology and continuous linear maps;
      inner products and orthogonal complements; partitions of unity;
      continuous functional calculus; sigma-compact spaces, compact refinements
      of finite open covers and bundle trivialization homeomorphisms.
    relationship: adapts
    license: Apache-2.0
    note: >-
      Extends the existing bundle structures, Hom topologies and Riemannian metric
      formalization. Module documentation preserves the specific authors and
      formalization approaches reused or followed.
related_formalizations:
  - id: https://github.com/leanprover-community/mathlib4
    relationship: builds-on
    note: >-
      Uses Mathlib's mathematical namespaces, original topologies and canonical
      bundle structures, including real Riemannian metric data.
