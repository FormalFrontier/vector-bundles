# Copy to .forgejo/workflows/lean-ci.yaml and set the checker digest below.
# The runner image supplies ff-lean-ci and ff-lean-auth; no host volumes are used.
name: Lean CI
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
concurrency:
  group: lean-ci-${{ github.event.pull_request.number || github.event_name == 'push' && 'push' || 'daily' }}
  cancel-in-progress: true
jobs:
  lean:
    name: Lean build and audit
    runs-on: lean-ci
    timeout-minutes: 180
    env:
      # Run `ff-lean-ci-v6 tools-sha` in the selected image. Update this pin whenever
      # the checker changes; docs-only reuse requires the same workflow bytes.
      FF_LEAN_CI_TOOLS_SHA256: b495e8ac285bfdcaa8a12e1d1f4e0dc6937cf03060c74d7662bc0ab0bab7caf5
      FF_LEAN_LINT_TOOLS_SHA256: 5e158bd49b7085397aed0f6e451d6a2fe83243c26af35e79c977f41ed76a9bdd
    steps:
      - name: Check out the proposed commit
        uses: https://data.forgejo.org/actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Record exact inputs
        id: inputs
        run: ff-lean-ci-v6 inputs --github-output "$GITHUB_OUTPUT"
      - name: Check for proven docs-only reuse
        id: reuse
        env:
          FF_LEAN_CI_API_TOKEN: ${{ github.token }}
        run: ff-lean-ci-v6 reuse --github-output "$GITHUB_OUTPUT"
      - name: Set up scoped dependency reads
        if: steps.reuse.outputs.reused != 'true'
        env:
          LEAN_CI_READ_AUTH: ${{ secrets.LEAN_CI_READ_AUTH }}
        run: ff-lean-auth setup
      - name: Check the pinned toolchain and fetch exact dependencies
        if: steps.reuse.outputs.reused != 'true'
        run: ff-lean-ci-v6 prepare
      - name: Remove dependency credentials
        if: always()
        run: ff-lean-auth cleanup
      - name: Record own setup metadata before the configured build/audit
        id: own_setup_baseline
        if: steps.reuse.outputs.reused != 'true'
        continue-on-error: true
        run: |
          python3 -X utf8 - <<'EOF'
          import json, os, stat
          # Metadata only, rooted at cwd: never follow input symlinks or open setup contents.
          def snapshot(name):
              parts = name.split("/")
              if any(part in ("", ".", "..") for part in parts):
                  raise OSError("Non-canonical input path")
              flags = os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW
              fd = os.open(".", flags)
              try:
                  s = os.fstat(fd)
                  parents = [[s.st_dev, s.st_ino]]
                  missing = False
                  for part in parts[:-1]:
                      if not missing:
                          try:
                              child = os.open(part, flags, dir_fd=fd)
                          except FileNotFoundError:
                              missing = True
                          else:
                              os.close(fd)
                              fd = child
                      if missing:
                          parents.append(None)
                      else:
                          s = os.fstat(fd)
                          parents.append([s.st_dev, s.st_ino])
                  leaf = None
                  if not missing:
                      try:
                          s = os.stat(parts[-1], dir_fd=fd, follow_symlinks=False)
                      except FileNotFoundError:
                          pass
                      else:
                          if not stat.S_ISREG(s.st_mode):
                              raise OSError("Non-regular input path")
                          leaf = [s.st_dev, s.st_ino, s.st_mode, s.st_size, s.st_mtime_ns, s.st_ctime_ns]
                  return {"parents": parents, "leaf": leaf}
              finally:
                  os.close(fd)
          modules = (
              "VectorBundles/Topology/FiberBundle/SumRange",
              "VectorBundlesTest/SplitRangeHomeomorph",
              "VectorBundles/Analysis/Normed/Operator/Completion",
              "VectorBundles/Analysis/Normed/Module/Completion",
              "VectorBundles/Topology/Module/FiniteCoordinates/OperatorNorm",
              "VectorBundles/Topology/Module/FiniteCoordinates",
              "VectorBundles/Topology/Module/FiniteCoordinates/FiniteDimensional",
              "VectorBundles/Data/Bundle",
              "VectorBundles/Topology/VectorBundle/FiniteRank/Weights",
              "VectorBundles/Topology/VectorBundle/FiniteRank/FiberCoordinates",
              "VectorBundles/Topology/VectorBundle/FiniteRank/Embedding",
              "VectorBundles/Topology/VectorBundle/ProjectorAtlas/SplitFamily",
              "VectorBundlesTest/Topology/VectorBundle/ComplementaryRangeBundle",
              "VectorBundles/Analysis/Normed/Module/JointEvaluation",
              "VectorBundles/Topology/Module/FiniteCoordinates/FiniteDimensional/Basic",
              "VectorBundlesTest/JointEvaluation",
          )
          states = {}
          for module in modules:
              try:
                  states[module] = {
                      "setup": snapshot(f".lake/build/ir/{module}.setup.json"),
                      "source": snapshot(module + ".lean"),
                  }
              except OSError:
                  states[module] = None
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print("setups=" + json.dumps(states, separators=(",", ":")), file=output)
          EOF
      - name: Build and run the configured audit
        id: build
        if: steps.reuse.outputs.reused != 'true'
        run: ff-lean-ci-v6 run
      - name: Produce independent own Lean JSON diagnostics
        id: own_diagnostics
        if: failure() && steps.build.outcome == 'failure' && steps.reuse.outputs.reused != 'true'
        continue-on-error: true
        env:
          OWN_SETUP_BASELINE: ${{ steps.own_setup_baseline.outputs.setups }}
        run: |
          python3 -X utf8 - <<'EOF'
          import json, os, pathlib, stat, subprocess
          # Same no-follow snapshot as before the build, including every existing ancestor.
          def snapshot(name):
              parts = name.split("/")
              if any(part in ("", ".", "..") for part in parts):
                  raise OSError("Non-canonical input path")
              flags = os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW
              fd = os.open(".", flags)
              try:
                  s = os.fstat(fd)
                  parents = [[s.st_dev, s.st_ino]]
                  missing = False
                  for part in parts[:-1]:
                      if not missing:
                          try:
                              child = os.open(part, flags, dir_fd=fd)
                          except FileNotFoundError:
                              missing = True
                          else:
                              os.close(fd)
                              fd = child
                      if missing:
                          parents.append(None)
                      else:
                          s = os.fstat(fd)
                          parents.append([s.st_dev, s.st_ino])
                  leaf = None
                  if not missing:
                      try:
                          s = os.stat(parts[-1], dir_fd=fd, follow_symlinks=False)
                      except FileNotFoundError:
                          pass
                      else:
                          if not stat.S_ISREG(s.st_mode):
                              raise OSError("Non-regular input path")
                          leaf = [s.st_dev, s.st_ino, s.st_mode, s.st_size, s.st_mtime_ns, s.st_ctime_ns]
                  return {"parents": parents, "leaf": leaf}
              finally:
                  os.close(fd)
          # The opaque configured build/audit step failed; these are diagnostics, not audit evidence.
          # This artifact contains only these new processes' streams and availability/exit info.
          root = pathlib.Path(".own-lean-diagnostics")
          root.mkdir()  # Fail closed rather than upload any pre-existing diagnostic files.
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"directory={root}/", file=output)
          try:
              baseline = json.loads(os.environ.get("OWN_SETUP_BASELINE", ""))
          except ValueError:
              baseline = {}
          if not isinstance(baseline, dict):
              baseline = {}
          # Static whitelist, priority order; no discovery or dependency-module execution.
          modules = (
              "VectorBundles/Topology/FiberBundle/SumRange",
              "VectorBundlesTest/SplitRangeHomeomorph",
              "VectorBundles/Analysis/Normed/Operator/Completion",
              "VectorBundles/Analysis/Normed/Module/Completion",
              "VectorBundles/Topology/Module/FiniteCoordinates/OperatorNorm",
              "VectorBundles/Topology/Module/FiniteCoordinates",
              "VectorBundles/Topology/Module/FiniteCoordinates/FiniteDimensional",
              "VectorBundles/Data/Bundle",
              "VectorBundles/Topology/VectorBundle/FiniteRank/Weights",
              "VectorBundles/Topology/VectorBundle/FiniteRank/FiberCoordinates",
              "VectorBundles/Topology/VectorBundle/FiniteRank/Embedding",
              "VectorBundles/Topology/VectorBundle/ProjectorAtlas/SplitFamily",
              "VectorBundlesTest/Topology/VectorBundle/ComplementaryRangeBundle",
              "VectorBundles/Analysis/Normed/Module/JointEvaluation",
              "VectorBundles/Topology/Module/FiniteCoordinates/FiniteDimensional/Basic",
              "VectorBundlesTest/JointEvaluation",
          )
          for module in modules:
              feedback = root / module
              feedback.mkdir(parents=True, exist_ok=True)
              setup = f".lake/build/ir/{module}.setup.json"
              source = module + ".lean"
              reason = None
              try:
                  before = baseline[module]
                  current = snapshot(setup)
                  current_source = snapshot(source)
                  old_setup = before["setup"]
                  # Missing parents may be created, but existing ancestry must retain identity.
                  old_parents = old_setup["parents"]
                  if (len(old_parents) != len(current["parents"]) or any(
                          old is not None and old != new
                          for old, new in zip(old_parents, current["parents"]))):
                      reason = "Existing setup ancestry was replaced or became unavailable."
                  elif current_source["leaf"] is None or before["source"] != current_source:
                      reason = "The exact own source or its ancestry changed or is unavailable."
                  elif current["leaf"] is None:
                      reason = "The configured build did not leave the exact setup file."
                  elif old_setup["leaf"] == current["leaf"]:
                      reason = "The setup was not newly generated or changed by this build."
              except (KeyError, TypeError):
                  reason = "Pre-build input metadata is unavailable."
              except OSError:
                  reason = "An input path is symlinked, non-regular or unavailable."
              if reason is not None:
                  (feedback / "unavailable.txt").write_text(reason + "\n", encoding="utf-8")
                  continue
              # Pass the same-run setup filename unchanged; never read its JSON contents here.
              with (feedback / "stdout.jsonl").open("wb") as stdout, (feedback / "stderr.log").open("wb") as stderr:
                  try:
                      result = subprocess.run(
                          ["lake", "env", "lean", source, "--setup", setup, "--json"],
                          stdout=stdout, stderr=stderr, check=False,
                      )
                  except OSError:
                      (feedback / "unavailable.txt").write_text("The diagnostic process could not start.\n", encoding="utf-8")
                      continue
              (feedback / "exit-code.txt").write_text(str(result.returncode) + "\n", encoding="utf-8")
          EOF
      - name: Record the lint tool digest
        id: lint_tools
        if: steps.reuse.outputs.reused != 'true'
        run: |
          python3 -X utf8 - <<'EOF'
          import os, subprocess, sys
          # Exactly one existing tool call; forward its stdout bytes without decoding.
          try:
              process = subprocess.Popen(["ff-lean-lint", "tools-sha"], stdout=subprocess.PIPE)
          except FileNotFoundError:
              sys.exit(127)
          except OSError:
              sys.exit(126)
          raw = b""
          while True:
              chunk = process.stdout.read1(8192)
              if not chunk:
                  break
              sys.stdout.buffer.write(chunk)
              sys.stdout.buffer.flush()
              if raw is not None:
                  raw = raw + chunk if len(raw) + len(chunk) <= 65 else None
          status = process.wait()
          try:
              import re
              def digest(value, pattern):
                  if value is None:
                      return "unknown", "invalid"
                  if not value:
                      return "missing", "missing"
                  if re.fullmatch(pattern, value):
                      return value.decode("ascii") if isinstance(value, bytes) else value, "valid"
                  return "unknown", "invalid"
              # Accept only a public SHA256, with at most one stdout line terminator.
              candidate = raw[:-1] if raw is not None and raw.endswith(b"\n") else raw
              actual, actual_shape = digest(candidate, b"[0-9a-f]{64}")
              expected, expected_shape = digest(os.environ.get("FF_LEAN_LINT_TOOLS_SHA256", ""), r"[0-9a-f]{64}")
              equality = "unknown"
              if actual_shape == expected_shape == "valid":
                  equality = "equal" if actual == expected else "different"
              fields = {
                  "actual_sha256": actual,
                  "expected_sha256": expected,
                  "actual_shape": actual_shape,
                  "expected_shape": expected_shape,
                  "equality": equality,
              }
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="ascii") as output:
                  for name, value in fields.items():
                      print(f"{name}={value}", file=output)
          except Exception:
              pass  # Metadata failure must not change the original tool's job status.
          sys.exit(status if status >= 0 else 128 - status)
          EOF
      - name: Reserve a fresh lint feedback file
        id: own_lint_file_baseline
        if: steps.build.outcome == 'success' && steps.reuse.outputs.reused != 'true'
        continue-on-error: true
        run: |
          python3 -X utf8 - <<'EOF'
          import json, os
          # Metadata only: reject any old log and never follow a path symlink.
          flags = os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW
          cwd = os.open(".", flags)
          os.mkdir(".own-lint-file-state", dir_fd=cwd)
          state = os.open(".own-lint-file-state", flags, dir_fd=cwd)
          try:
              os.mkdir(".lean-feedback", dir_fd=cwd)
          except FileExistsError:
              pass
          feedback = os.open(".lean-feedback", flags, dir_fd=cwd)
          log = os.open("lint.log", os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW,
                        0o600, dir_fd=feedback)
          def identity(fd):
              s = os.fstat(fd)
              return [s.st_dev, s.st_ino]
          s = os.fstat(log)
          baseline = {
              "cwd": identity(cwd),
              "feedback": identity(feedback),
              "log": [s.st_dev, s.st_ino, s.st_mode, s.st_size, s.st_mtime_ns, s.st_ctime_ns],
          }
          record = os.open("baseline.json", os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW,
                           0o600, dir_fd=state)
          with os.fdopen(record, "w", encoding="utf-8") as output:
              json.dump(baseline, output)
          for fd in (log, feedback, state, cwd):
              os.close(fd)
          EOF
      - name: Lint the configured libraries
        id: lint
        if: steps.reuse.outputs.reused != 'true'
        shell: bash
        run: |
          set -o pipefail
          mkdir -p .lean-feedback
          ff-lean-lint run 2>&1 | tee .lean-feedback/lint.log
      - name: Record independent CI step outcomes
        id: own_ci_step_outcomes
        if: always() && steps.inputs.outcome == 'success'
        continue-on-error: true
        run: |
          python3 -X utf8 - <<'EOF'
          import json, pathlib
          outcomes = {
              "inputs": "${{ steps.inputs.outcome }}",
              "reuse": "${{ steps.reuse.outcome }}",
              "own_setup_baseline": "${{ steps.own_setup_baseline.outcome }}",
              "build": "${{ steps.build.outcome }}",
              "own_diagnostics": "${{ steps.own_diagnostics.outcome }}",
              "lint": "${{ steps.lint.outcome }}",
          }
          if any(value not in {"success", "failure", "cancelled", "skipped"}
                 for value in outcomes.values()):
              raise ValueError("Unexpected workflow step outcome")
          root = pathlib.Path(".own-ci-step-diagnostics")
          root.mkdir()  # Never upload a pre-existing metadata file.
          (root / "stage-outcomes.json").write_text(
              json.dumps(outcomes, indent=2) + "\n", encoding="utf-8")
          EOF
      - name: Show the failed build or audit output
        if: failure()
        run: |
          python3 -X utf8 - <<'EOF'
          import json, pathlib, re
          # Build and audit commands only; dependency and credential steps stay in the artifact.
          labels = {"official-mathlib-cache", "verify-mathlib-cache", "lake-build", "sorry-gate", "axiom-audit"}
          feedback_dir = pathlib.Path(".lean-feedback")
          feedback_dir.mkdir(exist_ok=True)
          with (feedback_dir / "build-audit.log").open("wb") as feedback:
              for command in sorted(pathlib.Path(".lean-ci-evidence/commands").glob("*-*")):
                  receipt = command / "receipt.json"
                  if (command.name.split("-", 1)[1] not in labels or not receipt.is_file()
                          or json.loads(receipt.read_text()).get("exit_code") == 0):
                      continue
                  for stream in ["stderr", "stdout"]:
                      data = (command / stream).read_bytes()
                      feedback.write(f"{command.name} {stream}: {len(data)} bytes\n".encode())
                      feedback.write(data)
                      feedback.write(b"\n")
                      lines = data.decode(errors="replace").splitlines()
                      print(f"{command.name} {stream}: last {min(len(lines), 200)} of {len(lines)} lines")
                      for line in lines[-200:]:
                          # The prefix stops output lines being read as workflow commands.
                          print("| " + re.sub(r"[\x00-\x08\x0b-\x1f\x7f]", "", line)[:1000])
          EOF
      - name: Preserve commands, inputs, audit output and result
        if: always()
        uses: https://data.forgejo.org/actions/upload-artifact@c6a3b2bd78b3985e4b2f15397fec357f0fd808de # v3.2.2-node20, Forgejo-compatible
        with:
          name: lean-ci-evidence
          path: .lean-ci-evidence/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Preserve selected compiler and lint feedback
        if: always()
        uses: https://data.forgejo.org/actions/upload-artifact@c6a3b2bd78b3985e4b2f15397fec357f0fd808de # v3.2.2-node20, Forgejo-compatible
        with:
          name: lean-feedback
          path: .lean-feedback/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 30
      - name: Preserve independent CI step diagnostics
        if: always() && steps.inputs.outcome == 'success' && steps.own_ci_step_outcomes.outcome == 'success'
        continue-on-error: true
        uses: https://data.forgejo.org/actions/upload-artifact@c6a3b2bd78b3985e4b2f15397fec357f0fd808de # v3.2.2-node20, Forgejo-compatible
        with:
          name: own-ci-step-diagnostics
          path: |
            .lean-feedback/lint.log
            .own-ci-step-diagnostics/stage-outcomes.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Preserve independent own Lean diagnostics
        if: always() && steps.build.outcome == 'failure' && steps.own_diagnostics.outputs.directory != ''
        continue-on-error: true
        uses: https://data.forgejo.org/actions/upload-artifact@c6a3b2bd78b3985e4b2f15397fec357f0fd808de # v3.2.2-node20, Forgejo-compatible
        with:
          name: own-lean-diagnostics
          path: ${{ steps.own_diagnostics.outputs.directory }}
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 30
      - name: Preserve staged Lake cache outputs
        if: >-
          success() && steps.reuse.outputs.reused != 'true' && github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        # The staged outputs are optional: a failed upload only means nothing is published.
        continue-on-error: true
        uses: https://data.forgejo.org/actions/upload-artifact@c6a3b2bd78b3985e4b2f15397fec357f0fd808de # v3.2.2-node20, Forgejo-compatible
        with:
          name: lean-cache-stage
          path: .lean-ci-cache-stage/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 3
      - name: Record own CI stage outcomes
        id: own_stage_outcomes
        if: always()
        continue-on-error: true
        env:
          OWN_INPUTS_OUTCOME: ${{ steps.inputs.outcome }}
          OWN_REUSE_OUTCOME: ${{ steps.reuse.outcome }}
          OWN_BUILD_OUTCOME: ${{ steps.build.outcome }}
          OWN_DIAGNOSTICS_OUTCOME: ${{ steps.own_diagnostics.outcome }}
          OWN_LINT_TOOLS_OUTCOME: ${{ steps.lint_tools.outcome }}
          OWN_LINT_OUTCOME: ${{ steps.lint.outcome }}
          OWN_LINT_TOOLS_ACTUAL_SHA256: ${{ steps.lint_tools.outputs.actual_sha256 }}
          OWN_LINT_TOOLS_EXPECTED_SHA256: ${{ steps.lint_tools.outputs.expected_sha256 }}
          OWN_LINT_TOOLS_ACTUAL_SHAPE: ${{ steps.lint_tools.outputs.actual_shape }}
          OWN_LINT_TOOLS_EXPECTED_SHAPE: ${{ steps.lint_tools.outputs.expected_shape }}
          OWN_LINT_TOOLS_EQUALITY: ${{ steps.lint_tools.outputs.equality }}
        run: |
          python3 -X utf8 - <<'EOF'
          import json, os, pathlib, re
          # Fixed outcomes and validated public digests only; never read output/evidence files.
          def outcome(name):
              value = os.environ.get(name, "")
              if value == "":
                  return "missing"
              if value not in ("success", "failure", "cancelled", "skipped"):
                  raise ValueError("Unrecognized stage outcome.")
              return value
          outcomes = {
              "inputs": outcome("OWN_INPUTS_OUTCOME"),
              "reuse": outcome("OWN_REUSE_OUTCOME"),
              "build": outcome("OWN_BUILD_OUTCOME"),
              "own_diagnostics": outcome("OWN_DIAGNOSTICS_OUTCOME"),
              "lint_tools": outcome("OWN_LINT_TOOLS_OUTCOME"),
              "lint": outcome("OWN_LINT_OUTCOME"),
          }
          def digest_fields(value_name, shape_name):
              value = os.environ.get(value_name, "")
              shape = os.environ.get(shape_name, "")
              if shape == "valid" and re.fullmatch(r"[0-9a-f]{64}", value):
                  return value, "valid"
              if (shape == "missing" and value == "missing") or (shape == value == ""):
                  return "missing", "missing"
              return "unknown", "invalid" if shape == "invalid" else "unknown"
          actual, actual_shape = digest_fields("OWN_LINT_TOOLS_ACTUAL_SHA256", "OWN_LINT_TOOLS_ACTUAL_SHAPE")
          expected, expected_shape = digest_fields("OWN_LINT_TOOLS_EXPECTED_SHA256", "OWN_LINT_TOOLS_EXPECTED_SHAPE")
          equality = os.environ.get("OWN_LINT_TOOLS_EQUALITY", "")
          if equality not in ("equal", "different", "unknown"):
              equality = "missing" if equality == "" else "unknown"
          if actual_shape == expected_shape == "valid":
              if equality != ("equal" if actual == expected else "different"):
                  equality = "unknown"
          elif equality not in ("missing", "unknown"):
              equality = "unknown"
          outcomes["lint_tools_digest"] = {
              "actual_sha256": actual,
              "expected_sha256": expected,
              "actual_shape": actual_shape,
              "expected_shape": expected_shape,
              "equality": equality,
          }
          root = pathlib.Path(".own-ci-stage-outcomes")
          root.mkdir()  # Fail closed on any pre-existing directory, file or symlink.
          with (root / "stage-outcomes.json").open("x", encoding="utf-8") as record:
              json.dump(outcomes, record, sort_keys=True, indent=2)
              record.write("\n")
          EOF
      - name: Preserve own CI stage outcomes
        if: always() && steps.own_stage_outcomes.outcome == 'success'
        continue-on-error: true
        uses: https://data.forgejo.org/actions/upload-artifact@c6a3b2bd78b3985e4b2f15397fec357f0fd808de # v3.2.2-node20, Forgejo-compatible
        with:
          name: own-ci-stage-outcomes
          path: .own-ci-stage-outcomes/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Validate current failed lint feedback paths
        id: own_lint_file_check
        if: >-
          always() && steps.inputs.outcome == 'success' && steps.build.outcome == 'success' &&
          steps.lint.outcome == 'failure' && steps.reuse.outputs.reused != 'true' &&
          steps.own_lint_file_baseline.outcome == 'success' && steps.own_stage_outcomes.outcome == 'success'
        continue-on-error: true
        run: |
          python3 -X utf8 - <<'EOF'
          import json, os, stat
          flags = os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW
          files = os.O_RDONLY | os.O_NONBLOCK | os.O_NOFOLLOW
          cwd = os.open(".", flags)
          state = os.open(".own-lint-file-state", flags, dir_fd=cwd)
          def regular(name, parent):
              fd = os.open(name, files, dir_fd=parent)
              s = os.fstat(fd)
              if not stat.S_ISREG(s.st_mode) or s.st_nlink != 1:
                  raise ValueError("Expected a regular, unshared file")
              return fd
          record = regular("baseline.json", state)
          with os.fdopen(record, "r", encoding="utf-8") as source:
              baseline = json.load(source)
          def identity(fd):
              s = os.fstat(fd)
              return [s.st_dev, s.st_ino]
          feedback = os.open(".lean-feedback", flags, dir_fd=cwd)
          if identity(cwd) != baseline["cwd"] or identity(feedback) != baseline["feedback"]:
              raise ValueError("The source cwd or feedback ancestry changed")
          log = regular("lint.log", feedback)
          s = os.fstat(log)
          current = [s.st_dev, s.st_ino, s.st_mode, s.st_size, s.st_mtime_ns, s.st_ctime_ns]
          if current[:3] != baseline["log"][:3] or current[3:] == baseline["log"][3:]:
              raise ValueError("The reserved log was replaced or was not touched by this lint step")
          # Validate the existing fixed metadata file too; never read the raw lint stream.
          outcomes = os.open(".own-ci-stage-outcomes", flags, dir_fd=cwd)
          record = regular("stage-outcomes.json", outcomes)
          for fd in (record, outcomes, log, feedback, state, cwd):
              os.close(fd)
          EOF
      - name: Preserve current failed lint file and fixed stage metadata
        if: >-
          always() && steps.inputs.outcome == 'success' && steps.build.outcome == 'success' &&
          steps.lint.outcome == 'failure' && steps.reuse.outputs.reused != 'true' &&
          steps.own_stage_outcomes.outcome == 'success' && steps.own_lint_file_check.outcome == 'success'
        continue-on-error: true
        uses: https://data.forgejo.org/actions/upload-artifact@c6a3b2bd78b3985e4b2f15397fec357f0fd808de # v3.2.2-node20, Forgejo-compatible
        with:
          name: current-lint-file
          path: |
            .lean-feedback/lint.log
            .own-ci-stage-outcomes/stage-outcomes.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
