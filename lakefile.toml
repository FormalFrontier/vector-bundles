name = "vector-bundles"
version = "0.1.0"
defaultTargets = ["VectorBundles", "VectorBundlesTest"]

[leanOptions]
autoImplicit = false
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
weak.linter.style.header = false

[[lean_lib]]
name = "VectorBundles"
globs = [
  "VectorBundles",
  "VectorBundles.Analysis.InnerProductSpace.PositiveForm",
  "VectorBundles.Analysis.Normed.Ring.Units",
  "VectorBundles.Topology.Algebra.Module.FiniteDimensionalOperator",
  "VectorBundles.Topology.VectorBundle.CoordinateMap",
  "VectorBundles.Topology.VectorBundle.FiniteSum",
  "VectorBundles.Topology.VectorBundle.HermitianMetric",
  "VectorBundles.Topology.VectorBundle.Isomorphism",
  "VectorBundles.Topology.VectorBundle.Metric",
  "VectorBundles.Topology.VectorBundle.MetricExistence",
  "VectorBundles.Topology.VectorBundle.MetricModel",
  "VectorBundles.Topology.VectorBundle.OrthogonalAddition",
  "VectorBundles.Topology.VectorBundle.OrthogonalComplement",
  "VectorBundles.Topology.VectorBundle.OrthogonalProjection",
  "VectorBundles.Topology.VectorBundle.OrthonormalTrivialization",
  "VectorBundles.Topology.VectorBundle.SemilinearEvaluation",
  "VectorBundles.Topology.VectorBundle.WeightedForm",
]

[[lean_lib]]
name = "VectorBundlesTest"
globs = [
  "VectorBundlesTest",
  "VectorBundlesTest.Topology.VectorBundle.HermitianMetric",
  "VectorBundlesTest.Topology.VectorBundle.Isomorphism",
  "VectorBundlesTest.Topology.VectorBundle.Metric",
  "VectorBundlesTest.Topology.VectorBundle.OrthogonalAddition",
  "VectorBundlesTest.Topology.VectorBundle.OrthogonalComplement",
  "VectorBundlesTest.Topology.VectorBundle.OrthogonalProjection",
  "VectorBundlesTest.Topology.VectorBundle.OrthonormalTrivialization",
  "VectorBundlesTest.Topology.VectorBundle.SemilinearEvaluation",
]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "83abb3e776bdefcbc447a1e44d0debe4010039e5"
